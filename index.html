<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>나만의 명함 만들기</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">

        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <header class="site-header">
            <h1>나만의 명함 만들기</h1>
            <p>왼쪽에 입력하면 오른쪽에</p >
        </header>

        <main class="container">
            <section>
                <form action="#">

                    <fieldset>
                        <legend>기본 정보</legend>

                        <label for="input-name">이름</label>

                        <input type="text" id="input-name" placeholder="예 : 홍길동">

                        <label for="input-dept">학과</label>

                        <select id="input-dept">
                            <option>컴퓨터공학과</option>
                            <option>소프트웨어공학과</option>
                            <option>인공지능학과</option>
                            <option>게임콘텐츠학과</option>
                            <option>정보보안학과</option>
                        </select>

                        <label for="input-role">희망 분야</label>

                        <input type="text" id="input-role" placeholder="예 : 프론트엔드 개발자">
                    </fieldset>

                    <fieldset>
                        <legend>연락처</legend>
                        <label for="input-phone">전화번호</label>
                        <input type="tel" id="input-phone" placeholder="예:010-1234-5678">
                        
                        <label for="email">이메일</label>
                        <input type="email" id="input-email" placeholder="예:hong@silla.ar.kr">
                    </fieldset>

                    <fieldset>
                        <legend>한 줄 소개</legend>
                        <label id="input-intro" rows="3" placeholder="예 : 항상 최선을 다하는 사람."></textarea>
                    </fieldset>

                </form>
            </section>

            <section class="preview">
            <h2>미리보기</h2>
                <div class="card">
                    <div class="card-top">
                        <p class="card-dept">컴퓨터공학과</p >
                        <p class="card-name">홍길동</p >
                        <p class="card-role">프론트엔드 개발자</p >
                    </div>
                    <p class="card-contact">항상 최선을 다하는 사람</p >
                    <ul>
                        <li>📞<span class="card-phone">010-1234-5678</span></li>
                        <li>📧<span class="card-email">hong@silla.ac.kr</span></li>
                    </ul>
                </div>
            </section>

        </main>

        <footer>
            <small>&copy; 2026 웹기초프로그래밍</small>
        </footer>

        <script src="js/script.js"></script>
    </body>
</html>
